<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SETP Ibagué · Mapa de Proyectos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.8.0/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.8.0/maplibre-gl.min.js"></script>
<style>
  :root{
    --navy:#0A1F5C; --navy-deep:#001233; --royal:#1D4ED8; --gold:#F0A800;
    --verde:#00A830; --amarillo:#F0A800; --rojo:#D62828;
    --ink:#0B1220; --muted:#5A6785; --line:#E6EAF3; --paper:#F4F6FB;
    --panel-w: 480px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--navy-deep); overflow:hidden;
  }
  #mapa{position:absolute; inset:0}

  /* ================= barra institucional ================= */
  header{
    position:absolute; top:0; left:0; right:0; z-index:30; height:64px;
    display:flex; align-items:center; gap:18px; padding:0 22px;
    background:linear-gradient(120deg,var(--navy) 0%, var(--navy-deep) 100%);
    border-bottom:3px solid var(--gold);
    box-shadow:0 6px 24px rgba(0,0,0,.32);
  }
  header .h-logo{height:42px; width:auto; background:#fff; border-radius:9px; padding:5px}
  header .h-brand{flex:1; min-width:0; color:#fff}
  header .h-kicker{font-size:10px; text-transform:uppercase; letter-spacing:.22em; color:var(--gold); font-weight:700}
  header .h-name{font-size:17px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  header .h-leyenda{display:flex; gap:16px; align-items:center}
  header .h-leyenda span{display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; color:#D8DFF3; white-space:nowrap}
  header .h-leyenda i{width:11px; height:11px; border-radius:3px; display:inline-block}
  header .h-leyenda i.v{background:var(--verde)} header .h-leyenda i.a{background:var(--amarillo)} header .h-leyenda i.r{background:var(--rojo)}

  /* ================= panel de escena ================= */
  #panel{
    position:absolute; z-index:20; left:22px; top:82px; width:var(--panel-w);
    max-height:calc(100% - 170px); overflow-y:auto;
    background:#fff; border-radius:18px;
    box-shadow:0 26px 70px rgba(0,10,40,.38);
    transition:opacity .35s, transform .35s;
  }
  #panel.oculto{opacity:0; transform:translateX(-24px); pointer-events:none}

  /* banner de componente — grande y llamativo */
  .comp-banner{
    display:flex; align-items:center; gap:14px; padding:16px 24px;
    border-radius:18px 18px 0 0; color:#fff;
    background:linear-gradient(120deg, var(--comp,#0A1F5C), color-mix(in srgb, var(--comp,#0A1F5C) 65%, #000));
  }
  .comp-banner .c-num{
    flex:none; width:44px; height:44px; border-radius:12px; background:rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:900;
  }
  .comp-banner .c-lbl{font-size:10px; text-transform:uppercase; letter-spacing:.2em; opacity:.85; font-weight:700}
  .comp-banner .c-name{font-size:19px; font-weight:900; letter-spacing:-.01em; line-height:1.15}

  .p-body{padding:20px 24px 24px}
  #panel h2{font-size:24px; font-weight:900; color:var(--navy); letter-spacing:-.02em; margin:2px 0 12px}

  .estado{
    display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:800;
    text-transform:uppercase; letter-spacing:.05em; padding:5px 12px; border-radius:999px; margin-bottom:14px;
  }
  .estado .dot{width:9px; height:9px; border-radius:50%}
  .estado.verde{background:#E4F6E9; color:#0A6C2A} .estado.verde .dot{background:var(--verde)}
  .estado.amarillo{background:#FCF1D6; color:#8A6200} .estado.amarillo .dot{background:var(--amarillo)}
  .estado.rojo{background:#FBE3E3; color:#9A1C1C} .estado.rojo .dot{background:var(--rojo)}
  .estado.mixto{background:#EEF1F7; color:#3A4667}
  .estado.mixto .dot{background:linear-gradient(90deg,var(--verde) 33%,var(--amarillo) 33% 66%,var(--rojo) 66%)}

  .p-rs{
    font-size:11.5px; color:var(--muted); background:var(--paper); border-left:3px solid var(--gold);
    padding:8px 12px; border-radius:0 8px 8px 0; margin-bottom:14px; line-height:1.45;
  }
  .p-rs b{color:var(--navy)}
  .p-resumen{font-size:14px; line-height:1.6; color:#33405f}

  .p-ficha{list-style:none; margin:16px 0 0; border-top:1px solid var(--line)}
  .p-ficha li{display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px; line-height:1.5}
  .p-ficha .k{flex:none; width:150px; font-weight:800; color:var(--navy)}
  .p-ficha .v{color:#33405f}
  .p-ficha .v.alerta{color:#9A1C1C; font-weight:700}

  .p-dif{
    margin-top:16px; background:#F0F4FF; border:1px solid #DCE4FA; border-radius:12px; padding:13px 15px;
  }
  .p-dif .t{font-size:10px; text-transform:uppercase; letter-spacing:.14em; font-weight:800; color:var(--royal); margin-bottom:5px}
  .p-dif .x{font-size:12.5px; line-height:1.55; color:#2b3a5e}

  .p-valores{margin-top:16px; border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .p-valores .row{display:flex; justify-content:space-between; align-items:baseline; padding:9px 14px; font-size:13px; border-bottom:1px solid var(--line)}
  .p-valores .row:last-child{border-bottom:0}
  .p-valores .row .k{color:var(--muted); font-weight:600}
  .p-valores .row .v{font-weight:800; color:var(--navy)}
  .p-valores .row.total{background:var(--navy); }
  .p-valores .row.total .k{color:#B9C4E6; text-transform:uppercase; letter-spacing:.08em; font-size:11px; font-weight:800}
  .p-valores .row.total .v{color:#fff; font-size:16px}
  .p-valores .nota{font-size:10.5px; color:var(--muted); padding:7px 14px; line-height:1.4; background:var(--paper)}

  .p-sub{margin-top:16px; display:flex; flex-direction:column; gap:12px}
  .subp{border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .subp-h{background:var(--paper); color:var(--navy); font-weight:900; font-size:14px; padding:10px 14px; border-bottom:1px solid var(--line)}
  .subp .p-ficha{margin:0; border-top:0}
  .subp .p-ficha li{padding:8px 14px}
  .subp .p-valores{margin:10px 14px 14px}

  .p-fases{margin-top:16px; display:flex; flex-direction:column; gap:10px}
  .fase{border:1px solid var(--line); border-radius:12px; padding:12px 14px}
  .fase .fh{display:flex; align-items:center; gap:8px; margin-bottom:4px}
  .fase .fh .d{width:9px;height:9px;border-radius:50%}
  .fase .fh .d.amarillo{background:var(--amarillo)} .fase .fh .d.rojo{background:var(--rojo)} .fase .fh .d.verde{background:var(--verde)}
  .fase .fh b{font-size:13px; color:var(--navy)}
  .fase .ft{font-size:11.5px; color:#33405f; line-height:1.45}
  .fase .fv{font-size:11px; color:var(--muted); margin-top:5px}
  .fase .fv b{color:var(--navy)}

  .p-img{margin-top:16px; border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .p-img .ih{background:var(--navy); color:#fff; font-size:11px; font-weight:800; padding:8px 13px}
  .p-img img{display:block; width:100%; height:360px; object-fit:contain; background:var(--paper)}

  /* cortina antes / después — object-fit:contain para no cortar fotos
     verticales (algunas son retrato, otras panorámicas) */
  .ba{position:relative; height:360px; background:var(--paper); user-select:none; overflow:hidden}
  .ba img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block}
  .ba .despues{clip-path:inset(0 0 0 var(--pos,50%))}
  .ba .tag{position:absolute; top:8px; font-size:10px; font-weight:800; letter-spacing:.06em;
    background:rgba(10,31,92,.82); color:#fff; padding:3px 8px; border-radius:6px}
  .ba .tag.l{left:8px} .ba .tag.r{right:8px}
  .ba .handle{position:absolute; top:0; bottom:0; width:2px; background:#fff; left:var(--pos,50%); box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  .ba .handle:after{content:'\21D4'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:26px; height:26px; border-radius:50%; background:#fff; color:var(--navy);
    display:flex; align-items:center; justify-content:center; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .ba input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:ew-resize; margin:0}

  /* ================= índice / escena inicial ================= */
  .idx h2{font-size:26px; margin-bottom:14px}
  .idx .ctx p{font-size:13px; line-height:1.65; color:#33405f; margin-bottom:10px}
  .idx .ctx b{color:var(--navy)}
  .idx .comp-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:18px 0 6px}
  .idx .comp-btn{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:11px; cursor:pointer;
    border:1px solid var(--line); background:#fff; text-align:left; transition:transform .12s, box-shadow .12s;
  }
  .idx .comp-btn:hover{transform:translateY(-2px); box-shadow:0 10px 22px rgba(10,31,92,.14)}
  .idx .comp-btn .n{flex:none; width:26px; height:26px; border-radius:8px; color:#fff; font-weight:900; font-size:14px; display:flex; align-items:center; justify-content:center}
  .idx .comp-btn .t{font-size:12px; font-weight:700; color:var(--navy); line-height:1.25}

  /* ================= navegación inferior ================= */
  #nav{
    position:absolute; z-index:25; left:50%; bottom:22px; transform:translateX(-50%);
    display:flex; align-items:center; gap:15px;
    background:rgba(255,255,255,.97); padding:10px 16px; border-radius:999px;
    box-shadow:0 16px 44px rgba(0,10,40,.3);
  }
  #nav button{
    border:0; background:var(--navy); color:#fff; width:38px; height:38px; border-radius:50%;
    font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s, transform .1s;
  }
  #nav button:hover{background:#12308f} #nav button:active{transform:scale(.92)}
  #nav button:disabled{background:#C3CBDE; cursor:default}
  .dots{display:flex; gap:6px}
  .dots .d{width:8px; height:8px; border-radius:50%; background:#C3CBDE; cursor:pointer; transition:transform .2s, background .2s}
  .dots .d.on{background:var(--navy); transform:scale(1.4)}
  #contador{font-size:12px; font-weight:800; color:var(--navy); min-width:46px; text-align:center}

  .maplibregl-ctrl-attrib{font-size:10px}
  @media (max-width:820px){
    :root{--panel-w:auto}
    #panel{left:12px; right:12px; top:74px; max-height:46%}
  }
</style>
</head>
<body>

<div id="mapa"></div>

<header>
  <img class="h-logo" src="img/setp.png" alt="TransMusical SETP">
  <div class="h-brand">
    <div class="h-kicker">Sistema Estratégico de Transporte Público · Ibagué</div>
    <div class="h-name">Mapa de Proyectos</div>
  </div>
  <div class="h-leyenda">
    <span><i class="v"></i>Ejecutado</span>
    <span><i class="a"></i>En ejecución</span>
    <span><i class="r"></i>Estudios y diseños</span>
  </div>
  <img class="h-logo" src="img/alcaldia.png" alt="Alcaldía de Ibagué">
</header>

<section id="panel"><div id="panelBody"></div></section>

<div id="nav">
  <button id="prev" aria-label="Anterior">‹</button>
  <span id="contador">1 / 1</span>
  <div class="dots" id="dots"></div>
  <button id="next" aria-label="Siguiente">›</button>
</div>

<script src="datos.js"></script>
<script>
const COL = { verde:'#00A830', amarillo:'#F0A800', rojo:'#D62828', gris:'#94A3B8' };
const colEstado = e => COL[e] || COL.gris;
const flip = c => [c[1], c[0]];
const linea = a => a.map(flip);
const compColor = nombre => (COMPONENTES.find(c => c.nombre === nombre) || {}).color || '#0A1F5C';
const compNum   = nombre => (COMPONENTES.find(c => c.nombre === nombre) || {}).n || '';

const map = new maplibregl.Map({
  container:'mapa',
  style:{
    version:8,
    glyphs:'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf',
    sources:{
      base:{ type:'raster', tileSize:256, maxzoom:19,
        tiles:[
          'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
          'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
          'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
        ],
        attribution:'© OpenStreetMap contributors' }
    },
    layers:[
      { id:'fondo', type:'background', paint:{ 'background-color':'#eef0f3' } },
      { id:'base', type:'raster', source:'base',
        paint:{ 'raster-saturation':-0.86, 'raster-contrast':-0.12, 'raster-brightness-min':0.18, 'raster-opacity':0.92 } }
    ]
  },
  center:[-75.2050,4.4370], zoom:12.3, pitch:0, bearing:0,
  attributionControl:{ compact:true }
});
map.addControl(new maplibregl.NavigationControl({showCompass:true}), 'bottom-right');

let idx = 0;

/* capturar coordenadas: SHIFT + clic */
map.on('click', e => {
  if (!e.originalEvent.shiftKey) return;
  const t = `[${e.lngLat.lat.toFixed(5)}, ${e.lngLat.lng.toFixed(5)}]`;
  console.log('Coordenada:', t);
  navigator.clipboard && navigator.clipboard.writeText(t);
});

map.on('load', () => {
  /* corredores: una capa por corredor */
  Object.entries(CORREDORES).forEach(([key,c]) => {
    map.addSource('c-'+key, { type:'geojson', data:{
      type:'Feature', properties:{}, geometry:{ type:'LineString', coordinates:linea(c.coords) } }});
    map.addLayer({ id:'c-'+key+'-casing', type:'line', source:'c-'+key,
      layout:{ 'line-cap':'round', 'line-join':'round', visibility:'none' },
      paint:{ 'line-color':'#fff', 'line-width':11, 'line-opacity':.95 }});
    map.addLayer({ id:'c-'+key, type:'line', source:'c-'+key,
      layout:{ 'line-cap':'round', 'line-join':'round', visibility:'none' },
      paint:{ 'line-color':colEstado(c.estado), 'line-width':6 }});
  });

  puntosSource('paraderos', PARADEROS.map(c => ({ coord:c })), COL.verde, 2.6);
  puntosSource('paraderos12', (PARADEROS_12||[]).map(c => ({ coord:c })), COL.rojo, 6.5);
  marcadores('patios', PATIOS.map(p => ({ ...p, color:COL.rojo })), 11);
  marcadores('semaforos', SEMAFOROS.map(s => ({ nombre:`${s.nombre} · ${s.fase}`, color:colEstado(s.estado), coord:s.coord })), 6);

  render();

  /* ponytail: en este entorno, una fuente geojson creada aquí a veces queda
     sin "tilear" para siempre aunque su capa esté visible (bug observado con
     varias fuentes de puntos creadas en la misma tanda). Recrearla (quitar +
     volver a añadir con los mismos datos) lo arregla siempre; lo hacemos una
     vez, pasados unos ms, como red de seguridad. */
  setTimeout(() => {
    rehacerPuntos.forEach(fn => { try{ fn(); }catch(e){ console.error('rehacer', e); } });
    map.triggerRepaint();
  }, 400);
});

const rehacerPuntos = [];

/* recrea una fuente geojson de puntos y sus capas tal cual estaban
   (mismos datos, mismas capas, misma visibilidad) — ver nota más arriba.
   Ignora cualquier id de capa que ya no exista, para que una capa faltante
   (p.ej. el símbolo de texto, si sus glifos no cargaron) no aborte todo el
   reconstruido de las demás capas de ese grupo. */
function registrarRehacer(sourceId, layerIds){
  rehacerPuntos.push(() => {
    const data = map.getSource(sourceId)._data;
    const existentes = layerIds.filter(id => map.getLayer(id));
    const defs = existentes.map(id => ({ def:JSON.parse(JSON.stringify(map.getStyle().layers.find(l => l.id===id))),
      vis:map.getLayoutProperty(id,'visibility') }));
    existentes.forEach(id => map.removeLayer(id));
    map.removeSource(sourceId);
    map.addSource(sourceId, { type:'geojson', data });
    defs.forEach(({def,vis}) => {
      def.layout = Object.assign({}, def.layout, { visibility:vis||'none' });
      map.addLayer(def);
    });
  });
}

function puntosSource(id, arr, color, r){
  map.addSource(id, { type:'geojson', data:{
    type:'FeatureCollection',
    features:arr.map(p => ({ type:'Feature', properties:{}, geometry:{ type:'Point', coordinates:flip(p.coord) } }))
  }});
  map.addLayer({ id:id, type:'circle', source:id, layout:{ visibility:'none' },
    paint:{ 'circle-radius':['interpolate',['linear'],['zoom'],11,r,15,r*1.9],
      'circle-color':color, 'circle-stroke-color':'#fff', 'circle-stroke-width':1, 'circle-opacity':.92 }});
  registrarRehacer(id, [id]);
}

/* ponytail: patios y semáforos usan Marker de DOM (no capas GL de puntos).
   Son pocos puntos (≤ ~80) y así evitamos por completo el bug de MapLibre
   donde una fuente geojson recién creada a veces no llega a "tilearse" y
   queda invisible para siempre — un Marker de DOM no depende de eso. */
const gruposMarcadores = {};
function marcadores(id, arr, r){
  r = r || 7;
  gruposMarcadores[id] = arr.map(p => {
    const el = document.createElement('div');
    el.style.cssText = `width:0;height:0;position:relative`;
    el.title = p.nombre || '';
    el.innerHTML = `
      <div style="position:absolute; left:${-r*1.9}px; top:${-r*1.9}px; width:${r*3.8}px; height:${r*3.8}px;
        border-radius:50%; background:${p.color}; opacity:.18"></div>
      <div style="position:absolute; left:${-r}px; top:${-r}px; width:${r*2}px; height:${r*2}px;
        border-radius:50%; background:${p.color}; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35)"></div>`;
    return new maplibregl.Marker({element:el}).setLngLat(flip(p.coord));
  });
}
function setVisMarcadores(id, on){
  (gruposMarcadores[id]||[]).forEach(m => { on ? m.addTo(map) : m.remove(); });
}

const CAPAS = { paraderos:['paraderos'], paraderos12:['paraderos12'] };
const GRUPOS_MARCADORES = ['patios','semaforos'];
const setVis = (id,on) => { if(map.getLayer(id)) map.setLayoutProperty(id,'visibility', on?'visible':'none'); };

function render(){
  const s = ESCENAS[idx];

  /* --- capas --- */
  Object.values(CAPAS).flat().forEach(l => setVis(l,false));
  GRUPOS_MARCADORES.forEach(id => setVisMarcadores(id,false));
  Object.keys(CORREDORES).forEach(k => { setVis('c-'+k,false); setVis('c-'+k+'-casing',false); });
  const verCorr = k => { setVis('c-'+k,true); setVis('c-'+k+'-casing',true); };
  const todos = (s.capas||[]).includes('todos');
  (s.capas||[]).forEach(c => {
    if (CORREDORES[c]) verCorr(c);
    if (CAPAS[c]) CAPAS[c].forEach(l => setVis(l,true));
    if (GRUPOS_MARCADORES.includes(c)) setVisMarcadores(c,true);
  });
  if (todos){
    Object.keys(CORREDORES).forEach(verCorr);
    GRUPOS_MARCADORES.forEach(id => setVisMarcadores(id,true));
  }

  /* --- cámara --- */
  const padL = window.innerWidth > 820 ? 540 : 0;
  map.flyTo({ ...s.foco, duration:2200, essential:true, padding:{ left:padL, top:0, right:0, bottom:0 } });

  /* --- panel --- */
  panelBody.innerHTML = s.tipo === 'indice' ? plantillaIndice(s) : plantillaProyecto(s);
  panelBody.parentElement.scrollTop = 0;
  panelBody.querySelectorAll('img[data-ph]').forEach(img => {
    img.addEventListener('error', () => { img.src = placeholder(img.dataset.ph); }, {once:true});
  });
  const slider = panelBody.querySelector('.ba input');
  if (slider){
    const ba = slider.closest('.ba');
    slider.addEventListener('input', () => ba.style.setProperty('--pos', slider.value + '%'));
  }
  panelBody.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => irA(b.dataset.ir));

  /* --- navegación --- */
  contador.textContent = (idx+1) + ' / ' + ESCENAS.length;
  prev.disabled = idx===0; next.disabled = idx===ESCENAS.length-1;
  dots.querySelectorAll('.d').forEach((d,i) => d.classList.toggle('on', i===idx));
}

/* ---------- plantilla índice ---------- */
function plantillaIndice(s){
  const ctx = s.contexto.map(p => `<p>${p}</p>`).join('');
  const btns = COMPONENTES.map(c => `
    <button class="comp-btn" data-ir="${c.escena}">
      <span class="n" style="background:${c.color}">${c.n}</span>
      <span class="t">${c.nombre}</span>
    </button>`).join('');
  return `
    <div class="p-body idx">
      <h2>${s.titulo}</h2>
      <div class="ctx">${ctx}</div>
      <div class="comp-grid">${btns}</div>
    </div>`;
}

/* ---------- plantilla proyecto / ficha ---------- */
function plantillaProyecto(s){
  const color = compColor(s.componente);
  const num = compNum(s.componente);
  const banner = `
    <div class="comp-banner" style="--comp:${color}">
      <div class="c-num">${num}</div>
      <div>
        <div class="c-lbl">Componente ${num}</div>
        <div class="c-name">${s.componente}</div>
      </div>
    </div>`;

  const estados = {verde:'Ejecutado', amarillo:'En ejecución', rojo:'Estudios y diseños', mixto:'Avance por fases'};
  const chip = `<span class="estado ${s.estado}"><span class="dot"></span>${estados[s.estado]||s.estado}</span>`;

  const rs = s.rs ? `<div class="p-rs"><b>${s.rsLabel||'Contrato'}:</b> ${s.rs}</div>` : '';

  const filas = arr => (arr||[]).map(f => {
    const alerta = /POR CONFIRMAR|pendiente/i.test(f.v) ? ' alerta' : '';
    return `<li><span class="k">${f.k}</span><span class="v${alerta}">${f.v}</span></li>`;
  }).join('');
  const ficha = filas(s.ficha);

  let sub = '';
  if (s.subproyectos && s.subproyectos.length){
    sub = `<div class="p-sub">` + s.subproyectos.map(sp => {
      const spv = (sp.valores||[]).map(v => `<div class="row ${v.total?'total':''}"><span class="k">${v.k}</span><span class="v">${v.v}</span></div>`).join('');
      return `
      <div class="subp">
        <div class="subp-h">${sp.titulo}</div>
        ${sp.ficha?`<ul class="p-ficha">${filas(sp.ficha)}</ul>`:''}
        ${spv?`<div class="p-valores">${spv}</div>`:''}
      </div>`;
    }).join('') + `</div>`;
  }

  const dif = s.diferenciador ? `
    <div class="p-dif">
      <div class="t">Elemento diferenciador del SETP</div>
      <div class="x">${s.diferenciador}</div>
    </div>` : '';

  let valores = '';
  if (s.valores && s.valores.length){
    const rows = s.valores.map(v => `
      <div class="row ${v.total?'total':''}"><span class="k">${v.k}</span><span class="v">${v.v}</span></div>
      ${v.nota?`<div class="nota">${v.nota}</div>`:''}`).join('');
    valores = `<div class="p-valores">${rows}</div>`;
  }

  let fases = '';
  if (s.fases && s.fases.length){
    fases = `<div class="p-fases">` + s.fases.map(f => `
      <div class="fase">
        <div class="fh"><span class="d ${f.estado}"></span><b>${f.fase}</b></div>
        <div class="ft">${f.texto}${f.dato?` · ${f.dato}`:''}</div>
        <div class="fv"><b>Obra</b> ${f.obra}${f.interv?` · <b>Interventoría</b> ${f.interv}`:''}</div>
      </div>`).join('') + `</div>`;
  }

  let img = '';
  if (s.imagen && typeof s.imagen === 'object'){
    img = `
    <div class="p-img">
      <div class="ih">Antes / Después</div>
      <div class="ba" style="--pos:50%">
        <img class="antes"  src="${s.imagen.antes}"  data-ph="ANTES"   alt="Antes">
        <img class="despues" src="${s.imagen.despues}" data-ph="DESPUÉS" alt="Después">
        <span class="tag l">ANTES</span><span class="tag r">DESPUÉS</span>
        <div class="handle"></div>
        <input type="range" min="0" max="100" value="50" aria-label="Comparar antes y después">
      </div>
    </div>`;
  } else if (s.imagen){
    img = `
    <div class="p-img">
      <div class="ih">Imagen del proyecto</div>
      <img src="${s.imagen}" data-ph="IMAGEN DEL PROYECTO" alt="${s.titulo}">
    </div>`;
  }

  return `
    ${banner}
    <div class="p-body">
      <h2>${s.titulo}</h2>
      ${chip}
      ${rs}
      <p class="p-resumen">${s.resumen}</p>
      ${ficha?`<ul class="p-ficha">${ficha}</ul>`:''}
      ${sub}
      ${dif}
      ${fases}
      ${valores}
      ${img}
    </div>`;
}

function placeholder(txt){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400">
    <rect width="640" height="400" fill="#e2e6ef"/>
    <text x="50%" y="46%" font-family="Segoe UI,Arial" font-size="22" font-weight="800" fill="#8a95ad" text-anchor="middle">${txt}</text>
    <text x="50%" y="57%" font-family="Segoe UI,Arial" font-size="13" fill="#a7b0c4" text-anchor="middle">espacio reservado · colocar archivo en /img</text></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* ---------- navegación ---------- */
function ir(n){ idx = Math.max(0, Math.min(ESCENAS.length-1, n)); render(); }
function irA(id){ const i = ESCENAS.findIndex(e => e.id === id); if (i>=0) ir(i); }
prev.onclick = () => ir(idx-1);
next.onclick = () => ir(idx+1);
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight' || e.key==='PageDown') ir(idx+1);
  if (e.key==='ArrowLeft'  || e.key==='PageUp')   ir(idx-1);
});
dots.innerHTML = ESCENAS.map((_,i) => `<span class="d" data-i="${i}"></span>`).join('');
dots.querySelectorAll('.d').forEach(d => d.onclick = () => ir(+d.dataset.i));
</script>
</body>
</html>
